<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arrow Puzzle</title>
<style>
:root{box-sizing:border-box;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:#fff;color:#222;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
.screen{display:none;flex-direction:column;height:100%}
.screen.show{display:flex}
.top{background:#dcdcf2;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top,0px));gap:10px}
.top h1{margin:0;font-size:22px;flex:1;text-align:center}
.icon{width:46px;height:46px;border-radius:50%;border:0;background:#eeeefa;font-size:20px;cursor:pointer;color:#444;flex:none}
.pill{background:rgba(255,255,255,.6);border-radius:14px;padding:6px 18px;text-align:center;min-width:150px;flex:1;max-width:220px}
.title{font-size:18px;font-weight:700;display:inline-block}
.title.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
#lives{font-size:15px;letter-spacing:2px;margin-top:2px;display:inline-block}
#lives.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.progress{height:6px;background:#e4e4f5}
#bar{height:100%;width:0;background:linear-gradient(90deg,#7b7de0,#5b6cff);transition:width .45s ease}
.board{flex:1;display:flex;min-height:0;overflow:auto;background:#fff}
canvas{touch-action:pan-x pan-y;display:block;margin:auto;transition:opacity .3s}
#zoom{width:140px;accent-color:#5b6cff}
.bottom{background:#dcdcf2;display:flex;justify-content:center;gap:12px;padding:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
button{font:inherit;font-size:16px;padding:10px 20px;border:0;border-radius:12px;background:#5b6cff;color:#fff;cursor:pointer;transition:transform .1s}
button:active{transform:scale(.96)}
button.alt{background:#8d8fd6}
/* level menu */
.levels{flex:1;overflow:auto;padding:18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:12px;align-content:start}
.lv{height:76px;border-radius:14px;background:#5b6cff;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:18px;font-weight:700;padding:0}
.lv small{font-size:12px;font-weight:400;margin-top:2px;letter-spacing:1px}
.lv.done{background:#3fb37f}
.lv.bonus{background:linear-gradient(135deg,#ffd76a,#f5a524);color:#4a3000}
.lv.locked{background:#d8d8e6;color:#888;cursor:default}
.lv.locked:active{transform:none}
/* overlay */
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:20px}
#overlay.show{display:flex}
.card{background:#fff;padding:24px;border-radius:18px;text-align:center;max-width:320px;width:100%;animation:pop .4s cubic-bezier(.2,1.4,.4,1)}
.card p{font-size:18px;margin:8px 0 18px}
#stars{font-size:34px;color:#f5b82e;letter-spacing:4px;min-height:40px}
#stars span{display:inline-block;opacity:0;transform:scale(.3)}
#stars span.on{animation:star .5s forwards}
@keyframes star{0%{opacity:0;transform:scale(.3)}70%{opacity:1;transform:scale(1.25)}100%{opacity:1;transform:scale(1)}}
.row{display:flex;gap:10px;justify-content:center}
</style>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#dcdcf2">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>

<section id="menu" class="screen show">
  <div class="top"><h1>Arrow Puzzle</h1></div>
  <div class="levels" id="levels"></div>
</section>

<section id="game" class="screen">
  <div class="top">
    <button class="icon" id="back" aria-label="Levels">←</button>
    <div class="pill"><div id="lvlTxt" class="title">Level 1</div><div id="lives"></div></div>
    <button class="icon" id="hint" aria-label="Hint">💡</button>
  </div>
  <div class="progress"><div id="bar"></div></div>
  <div class="board"><canvas id="cv"></canvas></div>
  <div class="bottom"><input type="range" id="zoom" min="0.6" max="1.8" step="0.05" value="1" aria-label="Zoom"><button class="alt" id="restart">Restart</button></div>
</section>

<div id="overlay"><div class="card">
  <div id="stars"></div>
  <p id="msg"></p>
  <div class="row">
    <button class="alt" id="toMenu">Levels</button>
    <button id="act">Continue</button>
  </div>
</div></div>

<script>
const TOTAL_LEVELS = 300;
const MAX_MISTAKES = 3;
const DIRS = [{dr:-1,dc:0},{dr:0,dc:-1},{dr:1,dc:0},{dr:0,dc:1}]; // up, left, down, right

// ---------- progress (saved if the browser allows it) ----------
let save = {unlocked: 1, stars: {}};
try {
  const s = JSON.parse(localStorage.getItem('arrowPuzzleSave') || 'null');
  if (s && s.unlocked) save = s;
} catch (e) {}
function persist() {
  try { localStorage.setItem('arrowPuzzleSave', JSON.stringify(save)); } catch (e) {}
}

// ---------- game state ----------
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let level = 1, n = 4, occ = [], tracks = [], mask = [];
let mistakes = 0, flying = [], shakes = [], hintTrack = null, hintUntil = 0;
let pressTrack = null, cell = 0, dpr = 1, state = 'play';

const rnd = k => Math.floor(Math.random() * k);

// Difficulty curve: bigger boards, denser tracks, longer tracks as levels go up
// Every 10th level is a bonus level: a bigger, denser board
function isBonus(L) { return L % 10 === 0; }

function levelParams(L) {
  const bonus = isBonus(L);
  return {
    // bigger boards and longer snakes as levels go up
    n: Math.min(7 + Math.floor((L - 1) / 6) + (bonus ? 2 : 0), bonus ? 20 : 18),
    density: 0, // unused now (full board)
    maxLen: Math.min(4 + Math.floor(L / 10), 12) + (bonus ? 2 : 0)
  };
}

function rayHits(r, c, d, fn) {
  const {dr, dc} = DIRS[d];
  let rr = r + dr, cc = c + dc;
  while (rr >= 0 && cc >= 0 && rr < n && cc < n) {
    if (fn(rr, cc)) return true;
    rr += dr; cc += dc;
  }
  return false;
}

// Animal silhouettes: inside(x, y) for x, y in [-1, 1]
const SHAPES = [
  {name: 'fish', inside: (x, y) => {
    const body = (x / 0.6) ** 2 + (y / 0.35) ** 2 <= 1;
    const tail = x >= 0.55 && x <= 0.95 && Math.abs(y) <= (0.95 - x) * 1.2;
    return body || tail;
  }},
  {name: 'cat', inside: (x, y) => {
    const head = x * x + (y + 0.1) ** 2 <= 0.36;
    const ear1 = y < -0.3 && y > -0.85 && Math.abs(x + 0.35) <= (y + 0.85) * 0.45;
    const ear2 = y < -0.3 && y > -0.85 && Math.abs(x - 0.35) <= (y + 0.85) * 0.45;
    return head || ear1 || ear2;
  }},
  {name: 'bird', inside: (x, y) => {
    const body = (x / 0.55) ** 2 + ((y - 0.1) / 0.4) ** 2 <= 1;
    const head = (x - 0.45) ** 2 + (y + 0.3) ** 2 <= 0.0625;
    const tail = x >= -0.95 && x <= -0.4 && Math.abs(y - 0.1) <= (x + 0.95) * 0.9;
    return body || head || tail;
  }},
  {name: 'turtle', inside: (x, y) => {
    const shell = (x / 0.6) ** 2 + (y / 0.45) ** 2 <= 1;
    const head = x * x + (y + 0.6) ** 2 <= 0.03;
    const legs = [[-0.5, 0.5], [0.5, 0.5], [-0.5, -0.5], [0.5, -0.5]]
      .some(([lx, ly]) => (x - lx) ** 2 + (y - ly) ** 2 <= 0.03);
    return shell || head || legs;
  }}
];

function buildMask(shape) {
  const m = [];
  for (let r = 0; r < n; r++) {
    m.push([]);
    for (let c = 0; c < n; c++) {
      const x = ((c + 0.5) / n) * 2 - 1, y = ((r + 0.5) / n) * 2 - 1;
      m[r].push(shape.inside(x, y));
    }
  }
  return m;
}

// Covers every dot of the mask with tracks. Each track's exit must avoid earlier tracks,
// so the level stays solvable. Any dot that cannot be covered is removed from the picture.
function fillMask(maxLen) {
  occ = Array.from({length: n}, () => Array(n).fill(null));
  tracks = [];
  const free = (r, c) => r >= 0 && c >= 0 && r < n && c < n && mask[r][c] && !occ[r][c];
  let guard = 0;
  while (true) {
    const todo = [];
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (mask[r][c] && !occ[r][c]) todo.push({r, c});
    if (!todo.length) break;
    if (++guard > 40000) {
      for (const q of todo) mask[q.r][q.c] = false;
      break;
    }
    const start = todo[rnd(todo.length)];
    const want = Math.max(2, maxLen - rnd(3));
    const cells = [start];
    const seen = new Set([start.r + ',' + start.c]);
    let r = start.r, c = start.c, last = -1;
    while (cells.length < want) {
      const opts = [];
      for (let d = 0; d < 4; d++) {
        const nr = r + DIRS[d].dr, nc = c + DIRS[d].dc;
        if (free(nr, nc) && !seen.has(nr + ',' + nc)) opts.push(d);
      }
      if (!opts.length) break;
      last = opts[rnd(opts.length)];
      r += DIRS[last].dr; c += DIRS[last].dc;
      cells.push({r, c});
      seen.add(r + ',' + c);
    }
    const head = cells[cells.length - 1];
    // head may point in any direction with a clear exit (never back into its own body),
    // trying the natural direction first
    const others = [0, 1, 2, 3].filter(d => d !== last).sort(() => Math.random() - 0.5);
    const dirs = last >= 0 ? [last, ...others] : others;
    let dir = -1;
    for (const d of dirs) {
      const nr = head.r + DIRS[d].dr, nc = head.c + DIRS[d].dc;
      if (seen.has(nr + ',' + nc)) continue;
      if (!rayHits(head.r, head.c, d, (a, b) => occ[a][b] !== null)) { dir = d; break; }
    }
    if (dir < 0) continue;
    const tr = {cells, d: dir, alive: true};
    tracks.push(tr);
    cells.forEach(q => occ[q.r][q.c] = tr);
  }
}

// Full board: cut every dot into snakes first, then find an order to remove them.
// An arrow may point in any direction, so each snake can be aimed at a clear exit.
function removalOrderExists(list) {
  const grid = Array.from({length: n}, () => Array(n).fill(null));
  for (const t of list) for (const q of t.cells) grid[q.r][q.c] = t;
  const headOf = t => t.cells[t.cells.length - 1];
  const blocked = (t, d) => {
    const h = headOf(t);
    return rayHits(h.r, h.c, d, (a, b) => grid[a][b] !== null && grid[a][b] !== t);
  };
  let remaining = list.slice();
  while (remaining.length) {
    let idx = remaining.findIndex(t => !blocked(t, t.d));
    if (idx < 0) {
      // aim one snake at a clear exit
      let aimed = false;
      for (const t of remaining) {
        for (let d = 0; d < 4 && !aimed; d++) {
          if (!blocked(t, d)) { t.d = d; aimed = true; idx = remaining.indexOf(t); }
        }
        if (aimed) break;
      }
      if (!aimed) return false;
    }
    const t = remaining[idx];
    remaining.splice(idx, 1);
    t.cells.forEach(q => grid[q.r][q.c] = null);
  }
  return true;
}

function fillFull(maxLen) {
  for (let attempt = 0; attempt < 300; attempt++) {
    const covered = Array.from({length: n}, () => Array(n).fill(false));
    const list = [];
    for (let guard = 0; guard < 5000; guard++) {
      const todo = [];
      for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (!covered[r][c]) todo.push({r, c});
      if (!todo.length) break;
      const start = todo[rnd(todo.length)];
      const want = 1 + rnd(maxLen);
      const cells = [start];
      covered[start.r][start.c] = true;
      let r = start.r, c = start.c;
      while (cells.length < want) {
        const opts = [];
        for (let d = 0; d < 4; d++) {
          const nr = r + DIRS[d].dr, nc = c + DIRS[d].dc;
          if (nr >= 0 && nc >= 0 && nr < n && nc < n && !covered[nr][nc]) opts.push(d);
        }
        if (!opts.length) break;
        const d = opts[rnd(opts.length)];
        r += DIRS[d].dr; c += DIRS[d].dc;
        cells.push({r, c});
        covered[r][c] = true;
      }
      list.push({cells, d: rnd(4), alive: true});
    }
    if (removalOrderExists(list)) {
      tracks = list;
      occ = Array.from({length: n}, () => Array(n).fill(null));
      for (const t of tracks) for (const q of t.cells) occ[q.r][q.c] = t;
      return true;
    }
  }
  return false;
}

function makeLevel() {
  const p = levelParams(level);
  n = p.n;
  // full square board, every dot is part of the maze
  mask = Array.from({length: n}, () => Array(n).fill(true));
  if (!fillFull(p.maxLen)) fillMask(p.maxLen);
}

function removable(tr) {
  const head = tr.cells[tr.cells.length - 1];
  return !rayHits(head.r, head.c, tr.d, (a, b) => occ[a][b] !== null && occ[a][b] !== tr);
}

function centerOf(q) { return {x: (q.c + 0.5) * cell, y: (q.r + 0.5) * cell}; }

function resize() {
  const boardH = document.querySelector('.board').clientHeight;
  const boardW = document.querySelector('.board').clientWidth;
  const fit = Math.min(boardW - 24, boardH - 24, 520);
  const zoom = parseFloat(document.getElementById('zoom').value) || 1;
  dpr = window.devicePixelRatio || 1;
  cell = Math.max(10, Math.floor(fit / n * zoom));
  const size = cell * n;
  cv.style.width = size + 'px';
  cv.style.height = size + 'px';
  cv.width = size * dpr;
  cv.height = size * dpr;
}

function updateHud() {
  const lives = document.getElementById('lives');
  lives.textContent = '❤'.repeat(MAX_MISTAKES - mistakes) + '🖤'.repeat(mistakes);
  const total = tracks.length;
  const gone = tracks.filter(t => !t.alive).length;
  document.getElementById('bar').style.width = (total ? gone / total * 100 : 0) + '%';
}

function showScreen(id) {
  for (const s of document.querySelectorAll('.screen')) s.classList.toggle('show', s.id === id);
}

function openLevel(L) {
  level = L;
  showScreen('game');
  startLevel();
}

function startLevel() {
  mistakes = 0; flying = []; shakes = []; hintTrack = null; pressTrack = null;
  state = 'play';
  makeLevel();
  resize();
  const t = document.getElementById('lvlTxt');
  t.textContent = 'Level ' + level + (isBonus(level) ? ' ★' : '');
  t.classList.remove('pop'); void t.offsetWidth; t.classList.add('pop');
  cv.style.opacity = 1;
  updateHud();
  document.getElementById('overlay').classList.remove('show');
}

function renderMenu() {
  const box = document.getElementById('levels');
  box.innerHTML = '';
  for (let L = 1; L <= TOTAL_LEVELS; L++) {
    const b = document.createElement('button');
    const unlocked = L <= save.unlocked;
    const stars = save.stars[L] || 0;
    b.className = 'lv' + (!unlocked ? ' locked' : stars ? ' done' : '') + (unlocked && isBonus(L) ? ' bonus' : '');
    b.innerHTML = unlocked ? (L + '<small>' + '★'.repeat(stars) + '☆'.repeat(3 - stars) + '</small>') : ('🔒<small>' + L + '</small>');
    if (unlocked) b.onclick = () => openLevel(L);
    box.appendChild(b);
  }
}

function showOverlay(opts) {
  const ov = document.getElementById('overlay');
  const starsEl = document.getElementById('stars');
  starsEl.innerHTML = '';
  if (opts.stars !== undefined) {
    for (let i = 0; i < 3; i++) {
      const s = document.createElement('span');
      s.textContent = '★';
      s.style.color = i < opts.stars ? '#f5b82e' : '#ddd';
      starsEl.appendChild(s);
      setTimeout(() => s.classList.add('on'), 250 + i * 220);
    }
  }
  document.getElementById('msg').textContent = opts.msg;
  const act = document.getElementById('act');
  act.textContent = opts.btn;
  act.onclick = () => { ov.classList.remove('show'); opts.fn(); };
  ov.classList.add('show');
}

function goMenu() {
  document.getElementById('overlay').classList.remove('show');
  renderMenu();
  showScreen('menu');
}

// ---------- input ----------
function trackAt(e) {
  const rect = cv.getBoundingClientRect();
  const c = Math.floor((e.clientX - rect.left) / cell);
  const r = Math.floor((e.clientY - rect.top) / cell);
  if (r < 0 || c < 0 || r >= n || c >= n) return null;
  return occ[r][c];
}

cv.addEventListener('pointerdown', e => {
  if (state !== 'play') return;
  const tr = trackAt(e);
  if (!tr) return;
  pressTrack = tr;
  hintTrack = null;
  cv.setPointerCapture(e.pointerId);
});

cv.addEventListener('pointerup', e => {
  const tr = pressTrack;
  pressTrack = null;
  if (!tr || state !== 'play' || !tr.alive) return;
  const target = trackAt(e);
  if (target !== tr) return; // released elsewhere: cancel
  attempt(tr);
});

cv.addEventListener('pointercancel', () => { pressTrack = null; });

function attempt(tr) {
  if (removable(tr)) {
    tr.alive = false;
    cells_clear(tr);
    flying.push({tr, t0: performance.now()});
    updateHud();
  } else {
    mistakes++;
    shakes.push({tr, t0: performance.now()});
    const lives = document.getElementById('lives');
    lives.classList.remove('shake'); void lives.offsetWidth; lives.classList.add('shake');
    updateHud();
    if (mistakes >= MAX_MISTAKES) {
      state = 'lose';
      pressTrack = null;
      setTimeout(() => showOverlay({
        msg: 'Out of hearts! Try this level again.',
        btn: 'Try again',
        fn: startLevel
      }), 500);
    }
  }
}

function cells_clear(tr) {
  tr.cells.forEach(q => { if (occ[q.r][q.c] === tr) occ[q.r][q.c] = null; });
}

// ---------- drawing ----------
function drawTrack(tr, dx, dy, alpha, color) {
  const pts = tr.cells.map(centerOf);
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineWidth = Math.max(3, cell * 0.13);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  const head = pts[pts.length - 1];
  const v = DIRS[tr.d];
  ctx.beginPath();
  if (pts.length === 1) {
    // single dot: draw a short stub behind the arrow so it reads as a line
    ctx.moveTo(head.x + dx - v.dc * cell * 0.3, head.y + dy - v.dr * cell * 0.3);
  } else {
    pts.forEach((p, i) => i ? ctx.lineTo(p.x + dx, p.y + dy) : ctx.moveTo(p.x + dx, p.y + dy));
  }
  ctx.lineTo(head.x + dx, head.y + dy);
  ctx.stroke();

  const vx = v.dc, vy = v.dr;
  const hx = head.x + dx + vx * cell * 0.12;
  const hy = head.y + dy + vy * cell * 0.12;
  const s = cell * 0.24;
  ctx.beginPath();
  ctx.moveTo(hx + vx * s, hy + vy * s);
  ctx.lineTo(hx - vy * s, hy + vx * s);
  ctx.lineTo(hx + vy * s, hy - vx * s);
  ctx.closePath();
  ctx.fill();
  ctx.globalAlpha = 1;
}

// Returns the part of a polyline between arc lengths a and b
function subPath(pts, a, b) {
  const out = [];
  let acc = 0;
  for (let i = 0; i < pts.length - 1; i++) {
    const p = pts[i], q = pts[i + 1];
    const len = Math.hypot(q.x - p.x, q.y - p.y);
    const s0 = acc, s1 = acc + len;
    if (len > 0 && s1 >= a && s0 <= b) {
      const t0 = Math.max(0, (a - s0) / len), t1 = Math.min(1, (b - s0) / len);
      if (!out.length) out.push({x: p.x + (q.x - p.x) * t0, y: p.y + (q.y - p.y) * t0});
      out.push({x: p.x + (q.x - p.x) * t1, y: p.y + (q.y - p.y) * t1});
    }
    acc = s1;
  }
  return out;
}

// Track slides out like a snake: its tail follows the head along the exit line
function drawSnake(tr, e, color, alpha) {
  const body = tr.cells.map(centerOf);
  let Lb = 0;
  for (let i = 1; i < body.length; i++) Lb += Math.hypot(body[i].x - body[i-1].x, body[i].y - body[i-1].y);
  const v = DIRS[tr.d];
  const last = body[body.length - 1];
  const pts = body.slice();
  for (let k = 1; k <= n + 2; k++) pts.push({x: last.x + v.dc * cell * k, y: last.y + v.dr * cell * k});
  const total = Lb + (n + 2) * cell;
  const a = e * total, b = Math.min(a + Lb, total);
  const vis = subPath(pts, a, b);
  if (vis.length < 2) return;

  ctx.globalAlpha = alpha;
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineWidth = Math.max(3, cell * 0.13);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  vis.forEach((q, i) => i ? ctx.lineTo(q.x, q.y) : ctx.moveTo(q.x, q.y));
  ctx.stroke();

  const h = vis[vis.length - 1], pr = vis[vis.length - 2];
  let dx = h.x - pr.x, dy = h.y - pr.y;
  const L = Math.hypot(dx, dy) || 1;
  dx /= L; dy /= L;
  const sz = cell * 0.24;
  const hx = h.x + dx * cell * 0.12, hy = h.y + dy * cell * 0.12;
  ctx.beginPath();
  ctx.moveTo(hx + dx * sz, hy + dy * sz);
  ctx.lineTo(hx - dy * sz, hy + dx * sz);
  ctx.lineTo(hx + dy * sz, hy - dx * sz);
  ctx.closePath();
  ctx.fill();
  ctx.globalAlpha = 1;
}

// While a finger holds a track, show where it would travel
function drawPreview(tr) {
  const head = tr.cells[tr.cells.length - 1];
  const start = centerOf(head);
  const v = DIRS[tr.d];
  let r = head.r + v.dr, c = head.c + v.dc;
  let end = start, blocked = false;
  while (r >= 0 && c >= 0 && r < n && c < n) {
    const p = centerOf({r, c});
    if (occ[r][c] && occ[r][c] !== tr) { blocked = true; end = p; break; }
    end = p;
    r += v.dr; c += v.dc;
  }
  if (!blocked) end = {x: end.x + v.dc * cell * 0.5, y: end.y + v.dr * cell * 0.5};

  const color = blocked ? '#e74c3c' : '#2ecc71';
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineWidth = Math.max(3, cell * 0.07);
  ctx.lineCap = 'round';
  ctx.setLineDash([cell * 0.12, cell * 0.12]);
  ctx.beginPath();
  ctx.moveTo(start.x, start.y);
  ctx.lineTo(end.x, end.y);
  ctx.stroke();
  ctx.setLineDash([]);

  if (blocked) {
    ctx.lineWidth = Math.max(3, cell * 0.08);
    ctx.beginPath();
    ctx.arc(end.x, end.y, cell * 0.26, 0, Math.PI * 2);
    ctx.stroke();
  } else {
    // dot at the exit
    ctx.beginPath();
    ctx.arc(end.x, end.y, cell * 0.09, 0, Math.PI * 2);
    ctx.fill();
  }
}

function frame(now) {
  requestAnimationFrame(frame);
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.save();
  ctx.scale(dpr, dpr);

  shakes = shakes.filter(s => now - s.t0 < 400);
  const blink = now < hintUntil ? (Math.sin(now / 120) > 0 ? '#e74c3c' : '#111') : null;

  for (const tr of tracks) {
    if (!tr.alive) continue;
    const s = shakes.find(x => x.tr === tr);
    let dx = 0;
    if (s) {
      const t = (now - s.t0) / 400;
      dx = Math.sin(t * Math.PI * 6) * cell * 0.12 * (1 - t);
    }
    const color = (tr === hintTrack && blink) ? blink : (tr === pressTrack ? '#5b6cff' : '#111');
    drawTrack(tr, dx, 0, 1, color);
  }

  if (pressTrack && pressTrack.alive) drawPreview(pressTrack);

  flying = flying.filter(f => now - f.t0 < 450);
  for (const f of flying) {
    const t = Math.min(1, (now - f.t0) / 450);
    const ease = t * t * (3 - 2 * t);           // smooth start and stop
    const fade = Math.max(0, Math.min(1, (1 - t) / 0.3));
    drawSnake(f.tr, ease, '#111', fade);
  }

  ctx.restore();

  if (state === 'play' && flying.length === 0 && tracks.every(t => !t.alive)) {
    state = 'win';
    const stars = mistakes === 0 ? 3 : mistakes === 1 ? 2 : 1;
    save.stars[level] = Math.max(save.stars[level] || 0, stars);
    if (level === save.unlocked && level < TOTAL_LEVELS) save.unlocked = level + 1;
    persist();
    setTimeout(() => showOverlay({
      msg: 'Level ' + level + ' complete!',
      stars,
      btn: level < TOTAL_LEVELS ? 'Next level' : 'Finish',
      fn: () => { if (level < TOTAL_LEVELS) openLevel(level + 1); else goMenu(); }
    }), 300);
  }

}

function showHint() {
  if (state !== 'play') return;
  const tr = tracks.find(t => t.alive && removable(t));
  if (!tr) return;
  hintTrack = tr;
  hintUntil = performance.now() + 1500;
}

// ---------- buttons ----------
document.getElementById('back').onclick = goMenu;
document.getElementById('restart').onclick = startLevel;
document.getElementById('hint').onclick = showHint;
document.getElementById('toMenu').onclick = goMenu;
document.getElementById('zoom').addEventListener('input', () => { if (document.getElementById('game').classList.contains('show')) resize(); });
window.addEventListener('resize', () => { if (document.getElementById('game').classList.contains('show')) resize(); });

renderMenu();
requestAnimationFrame(frame);
</script>
<script>
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }
</script>
